
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 380px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px #00000030;
        }

        .login-box h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 28px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        .input-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px #667eea50;
        }

        .password-wrapper {
            display: flex;
            gap: 5px;
        }

        .password-wrapper input {
            min-width: 0;
            flex: 1;
        }

        .show-btn {
            border: none;
            background: #eee;
            border-radius: 8px;
            padding: 0 10px;
            cursor: pointer;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            margin-bottom: 22px;
        }

        .options a, .signup a {
            color: #667eea;
            text-decoration: none;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #5366d5;
        }

        .signup {
            text-align: center;
            margin-top: 22px;
            color: #777;
            font-size: 14px;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h1>Welcome Back!</h1>
        <p class="subtitle">Please login to your account</p>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                        minlength="6"
                    >
                    <button
                        type="button"
                        class="show-btn"
                        onclick="togglePassword()"
                    >Show</button>
                </div>
            </div>

            <div class="options">
                <label>
                    <input type="checkbox" id="remember">
                    Remember me
                </label>
                <a href="#" onclick="forgotPassword(event)">
                    Forgot password?
                </a>
            </div>

            <button type="submit" class="login-btn">Login</button>
            <p id="message" role="status"></p>
        </form>

        <p class="signup">
            Don't have an account?
            <a href="#" onclick="signUp(event)">Sign up</a>
        </p>
    </div>

    <script>
        function togglePassword() {
            const password = document.getElementById("password");
            const button = document.querySelector(".show-btn");

            if (password.type === "password") {
                password.type = "text";
                button.textContent = "Hide";
            } else {
                password.type = "password";
                button.textContent = "Show";
            }
        }

        document.getElementById("loginForm").addEventListener(
            "submit",
            function(event) {
                event.preventDefault();

                const email = document.getElementById("email").value;
                const message = document.getElementById("message");

                message.style.color = "#b45309";
                message.textContent =
                    "Demo only: the form is valid, but no real login system is connected.";
            }
        );

        function forgotPassword(event) {
            event.preventDefault();
            alert("Connect a password-reset service to reset your password.");
        }

        function signUp(event) {
            event.preventDefault();
            alert("You can connect this link to your registration page.");
        }
    </script>

</body>
</html>
